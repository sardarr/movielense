[project]
name = "movielense"
version = "0.1.0"
description = "Self-running recommendation research pipeline on MovieLens"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.4,<2.0",
    "torch>=2.2,<3.0",
    "lightgbm>=4.3,<5.0",
    "optuna>=3.6,<5.0",
    "mlflow>=2.15,<3.0",
    "jinja2>=3.1,<4.0",
    "plotly>=5.22,<6.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "tqdm>=4.66,<5.0",
    "sentence-transformers>=2.7,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "ruff>=0.5,<1.0",
]
wandb = [
    "wandb>=0.17,<1.0",
]
analysis = [
    "shap>=0.45,<1.0",
]

[project.scripts]
movielense = "movielense.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movielense"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
