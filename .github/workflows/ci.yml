name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: setup python
        run: uv python install 3.12

      - name: sync deps
        run: uv sync --extra dev

      - name: lint
        run: uv run ruff check src tests

      - name: test
        run: uv run pytest -q
