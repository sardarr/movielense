name: pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

# Smoke-mode pipeline runs as a sanity check on demand or weekly. It does NOT
# publish to GitHub Pages — Pages is served from the manually-committed
# /docs folder so the live dashboard reflects real research runs, not the
# CI ml-100k smoke output.
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: setup python
        run: uv python install 3.12

      - name: sync deps
        run: uv sync --extra dev

      - name: run pipeline (smoke mode)
        run: uv run python -m movielense.run --smoke

      - name: upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: movielense-run-${{ github.run_id }}
          path: |
            artifacts/
            mlruns.db
            mlruns/
          if-no-files-found: warn
